// senseai-ingest wire format, v1.
//
// This is the contract downstream packages (senseai-tokens, senseai-bench,
// the ROS 2 bridge) consume. Message and field names mirror the Python
// dataclasses in senseai_ingest.stream one-to-one; see README §"Wire format".
//
// Conventions:
//   * All timestamps are int64 nanoseconds.
//   * All tensors are little-endian, C-contiguous.
//   * Field numbers are frozen once released; add, never renumber.

syntax = "proto3";

package senseai.ingest.v1;

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Mirrors senseai_ingest.stream.Modality. Python value "event" <-> MODALITY_EVENT.
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_EVENT = 1;    // dict {t,x,y,p}: sparse address-events
  MODALITY_FRAME = 2;    // HxWxC uint8/uint16
  MODALITY_AUDIO = 3;    // NxC int16/float32 block
  MODALITY_IMU = 4;      // (6,) float64: accel[3] m/s^2, gyro[3] rad/s
  MODALITY_CONTACT = 5;  // (K,) float32 force or () uint32 bumper mask
  MODALITY_CURRENT = 6;  // (J,) float32 amps per joint
  MODALITY_THERMAL = 7;  // HxW float32
  MODALITY_GAS = 8;      // dict {name: () float64}
  MODALITY_LIDAR = 9;    // Nx4 float32 (x, y, z, intensity)
  MODALITY_OTHER = 10;
}

// Element type of a Tensor. Always little-endian.
enum DType {
  DTYPE_UNSPECIFIED = 0;
  DTYPE_BOOL = 1;
  DTYPE_UINT8 = 2;
  DTYPE_INT8 = 3;
  DTYPE_UINT16 = 4;
  DTYPE_INT16 = 5;
  DTYPE_UINT32 = 6;
  DTYPE_INT32 = 7;
  DTYPE_UINT64 = 8;
  DTYPE_INT64 = 9;
  DTYPE_FLOAT16 = 10;
  DTYPE_FLOAT32 = 11;
  DTYPE_FLOAT64 = 12;
}

// How a source's t_master_ns was derived from its t_source_ns.
enum ClockMode {
  CLOCK_MODE_UNSPECIFIED = 0;
  // Offset is known a priori (replay: dataset timebase; live: hardware-synced).
  CLOCK_MODE_FIXED = 1;
  // Offset estimated online from host arrival times (median of first K samples,
  // periodically re-estimated for drift).
  CLOCK_MODE_ESTIMATED = 2;
}

// ---------------------------------------------------------------------------
// Payload containers
// ---------------------------------------------------------------------------

// A dense n-d array. Equivalent to a little-endian, C-ordered numpy array.
// len(buffer) == prod(shape) * itemsize(dtype). A 0-d tensor has empty shape.
message Tensor {
  DType dtype = 1;
  repeated int64 shape = 2;
  bytes buffer = 3;
}

// Columnar payload, e.g. EVENT {t, x, y, p} or GAS {co2, voc}.
// Mirrors a Python dict[str, np.ndarray].
message TensorMap {
  map<string, Tensor> entries = 1;
}

// Typed metadata value. Used instead of google.protobuf.Struct because Struct
// stores numbers as double and silently truncates int64 timestamps > 2^53.
message Value {
  oneof kind {
    int64 int_value = 1;
    double double_value = 2;
    string string_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    Tensor tensor_value = 6;   // e.g. 3x3 camera intrinsics
    ValueList list_value = 7;
    ValueMap map_value = 8;
  }
}

message ValueList {
  repeated Value values = 1;
}

message ValueMap {
  map<string, Value> entries = 1;
}

// ---------------------------------------------------------------------------
// Core messages (mirror senseai_ingest.stream dataclasses)
// ---------------------------------------------------------------------------

// One reading (or one batch, for EVENT/AUDIO) from one source.
//
// Timestamp convention (causal): t_*_ns is the capture time of the LAST datum
// in the payload, i.e. the earliest instant the whole payload could exist.
message Sample {
  string source_id = 1;       // "dvs0", "rgb0", "mic0"
  Modality modality = 2;
  int64 t_source_ns = 3;      // device timebase
  int64 t_master_ns = 4;      // master timebase, after clock alignment
  oneof data {                // np.ndarray -> tensor, dict -> tensors
    Tensor tensor = 5;
    TensorMap tensors = 6;
  }
  map<string, Value> meta = 7;
}

// Samples of one source within one tick, in non-decreasing t_master_ns order.
// Needed because proto3 map values cannot be `repeated`.
message SampleList {
  repeated Sample samples = 1;
}

// Everything that happened on the master clock in one tick window
//   [t_master_ns - tick_ns, t_master_ns)
// (except late samples re-attached under late_policy=attach_next, which keep
// their true, earlier t_master_ns).
//
// Every configured source has a key in `samples`; a source with no data in
// this window maps to an EMPTY SampleList — it is never omitted.
message AlignedTick {
  uint64 index = 1;           // 0-based, contiguous; a gap means a lost tick
  int64 t_master_ns = 2;      // tick close time (exclusive window end)
  int64 tick_ns = 3;          // window length
  map<string, SampleList> samples = 4;
}

// Static description of a source plus its clock-alignment state.
//
// Clock model:  t_master_ns = t_source_ns + offset_ns
//                            + round(drift_ppm * 1e-6 * (t_source_ns - offset_ref_ns))
message SourceSpec {
  string source_id = 1;
  Modality modality = 2;
  double nominal_rate_hz = 3;   // samples/s (EVENT: batches/s; see meta.event_rate_hz)
  map<string, Value> meta = 4;  // resolution, sample_rate, intrinsics, units...
  ClockMode clock_mode = 5;
  int64 offset_ns = 6;
  int64 offset_ref_ns = 7;      // t_source_ns at which offset_ns was measured
  double drift_ppm = 8;
  int64 jitter_ns = 9;          // residual: p99 |arrival - predicted| after offset
  uint32 offset_samples = 10;   // K samples used for the current estimate
}
