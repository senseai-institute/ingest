# M3ED (Chaney et al., CVPRW 2023) — one <sequence>_data.h5 per sequence, timestamps in µs.
# Paths follow the published M3ED HDF5 layout; verify against your download with
# `senseai-ingest inspect --path <file>` (all non-event sources are optional).
# Ouster LiDAR is stored as raw packets in M3ED and is not decoded here (out of scope for Gate 1).
name: m3ed
description: M3ED <sequence>_data.h5 (Prophesee events, OVC frames + IMU)
detect: []
sources:
  - id: events_left
    modality: event
    file: "*_data.h5"
    events: {t: /prophesee/left/t, x: /prophesee/left/x, y: /prophesee/left/y, p: /prophesee/left/p}
    time: {unit: us}
    meta: {width: 1280, height: 720, camera: left}
  - id: events_right
    modality: event
    file: "*_data.h5"
    events: {t: /prophesee/right/t, x: /prophesee/right/x, y: /prophesee/right/y, p: /prophesee/right/p}
    time: {unit: us}
    meta: {width: 1280, height: 720, camera: right}
    optional: true
  - id: rgb
    modality: frame
    file: "*_data.h5"
    t: /ovc/ts
    data: /ovc/rgb/data
    time: {unit: us}
    meta: {encoding: rgb8}
    optional: true
  - id: mono_left
    modality: frame
    file: "*_data.h5"
    t: /ovc/ts
    data: /ovc/left/data
    time: {unit: us}
    meta: {encoding: mono8}
    optional: true
  - id: imu
    modality: imu
    file: "*_data.h5"
    t: /ovc/imu/ts
    data: [/ovc/imu/accel, /ovc/imu/omega]
    time: {unit: us}
    meta: {frame_id: ovc_imu}
    optional: true
